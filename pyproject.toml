[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oudjat"
version = "0.8.1a1"
description = "Oudjat is a SOC toolbox and maybe more if I have the time"
readme = "README.md"
requires-python = ">=3.13"

authors = [
  { name = "me1k0r", email = "runner-me1k0r@proton.me" }
]

maintainers = [
  { name = "me1k0r", email = "runner-me1k0r@proton.me" }
]

license = { file = "LICENSE" }

dependencies = [
  "beautifulsoup4",
  "commentjson",
  "docopt",
  "keyring",
  "ldap3",
  "lxml",
  "orjson",
  "pytenable",
  "requests",
]

[project.urls]
homepage = "https://codeberg.org/me1k0r/oudjat"
repository = "https://codeberg.org/me1k0r/oudjat"

[project.scripts]
oudjat = "oudjat.cli:main"
